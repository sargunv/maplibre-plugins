# Windowed viewer: loads a native plugin into maplibre-native-c and shows its
# example layer on a live map. Edit the layer JSON while it runs to tweak
# paint properties. `weather` opens the animated-icon weather-stations demo,
# `building-osm` the building layer on real OSM buildings of Bamberg.
# Needs `mise run ffi:build` first. The viewer follows the install's render
# backend: with MLN_NATIVE_PRESET=macos-arm64-vulkan (or macos-arm64-egl) set
# for `mise run ffi:build` and these tasks, it runs on Vulkan through MoltenVK
# (Homebrew's molten-vk and vulkan-loader) or on OpenGL ES through ANGLE.

[tools]
"core:zig" = "{{vars.zig_version}}"

[vars]
# A macOS Vulkan install links Homebrew's Vulkan loader and runs on MoltenVK,
# which the loader finds only through VK_DRIVER_FILES; the FFI's own
# mise.macos.toml sets both the same way. Other backends ignore them.
zig_build = '''
if [ "$(uname)" = Darwin ]; then
  export MLN_FFI_VULKAN_LOADER_DIR="${MLN_FFI_VULKAN_LOADER_DIR:-/opt/homebrew/opt/vulkan-loader/lib}"
  export VK_DRIVER_FILES="${VK_DRIVER_FILES:-/opt/homebrew/opt/molten-vk/etc/vulkan/icd.d/MoltenVK_icd.json}"
fi
zig build'''

[deps.zig]
auto = true
description = "Fetch Zig package dependencies."
sources = [
  "build.zig",
  "build.zig.zon",
  "../../plugins/*/native/build.zig",
  "../../plugins/*/native/build.zig.zon",
]
outputs = ["zig-pkg"]
timeout = "10m"
run = "zig build --fetch=needed"

[tasks.build]
description = "Build the viewer and every plugin it knows."
run = '''
{{vars.zig_build}} \
  -Dnative-install-dir="$MLN_NATIVE_INSTALL_DIR" \
  -Ddependency-include-dir="$MLN_FFI_DIR/third_party/maplibre-native/vendor/Vulkan-Headers/include"
'''

[tasks.test]
description = "Run the viewer's unit tests (the play-once pick)."
run = '''
{{vars.zig_build}} test \
  -Dnative-install-dir="$MLN_NATIVE_INSTALL_DIR" \
  -Ddependency-include-dir="$MLN_FFI_DIR/third_party/maplibre-native/vendor/Vulkan-Headers/include"
'''

[tasks.run]
description = "Open the viewer on a plugin's example layer; edit the JSON live."
usage = '''
arg "[plugin]" default="location-indicator"
arg "[args]..." var=#true help="Extra viewer flags, e.g. --style url --zoom 15"
'''
run = '''
{{vars.zig_build}} "run-$usage_plugin" \
  -Dnative-install-dir="$MLN_NATIVE_INSTALL_DIR" \
  -Ddependency-include-dir="$MLN_FFI_DIR/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- --layer "../../plugins/$usage_plugin/examples/layer.json" $usage_args
'''

[tasks.weather]
description = "Open the viewer on the weather-stations demo (icons loop, out of sync); pass --layer ../../plugins/animated-icon/examples/weather/play-once.layer.json for hover play-once."
usage = '''
arg "[args]..." var=#true help="Extra viewer flags, e.g. --layer ../../plugins/animated-icon/examples/weather/play-once.layer.json"
'''
run = '''
{{vars.zig_build}} run-animated-icon \
  -Dnative-install-dir="$MLN_NATIVE_INSTALL_DIR" \
  -Ddependency-include-dir="$MLN_FFI_DIR/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- --layer ../../plugins/animated-icon/examples/weather/layer.json \
  --geojson stations=../../plugins/animated-icon/examples/weather/stations.geojson \
  --catalog ../../plugins/animated-icon/catalog/weather.mlvc \
  --play-once stations \
  --style https://tiles.openfreemap.org/styles/dark --center 12,28 --zoom 2.6 --bearing 0 --pitch 0 \
  $usage_args
'''

[tasks.building-osm]
description = "Open the viewer on the building layer's Bamberg demo: OSM buildings of the old town with their roof tagging (© OpenStreetMap contributors, ODbL)."
usage = '''
arg "[args]..." var=#true help="Extra viewer flags, e.g. --zoom 18 --bearing 300"
'''
run = '''
{{vars.zig_build}} run-building \
  -Dnative-install-dir="$MLN_NATIVE_INSTALL_DIR" \
  -Ddependency-include-dir="$MLN_FFI_DIR/third_party/maplibre-native/vendor/Vulkan-Headers/include" \
  -- --layer ../../plugins/building/examples/osm/layer.json \
  --geojson osm-buildings=../../plugins/building/examples/osm/buildings.geojson \
  --geojson-options osm-buildings=../../plugins/building/examples/osm/source.json \
  --style https://tiles.openfreemap.org/styles/positron --before waterway_line_label \
  --center 49.8915,10.8850 --zoom 16.5 --bearing 0 --pitch 60 \
  $usage_args
'''

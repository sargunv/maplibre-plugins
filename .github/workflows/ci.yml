name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # The FFI submodule is only needed for the native viewer, which CI
        # does not build.
      - uses: jdx/mise-action@v3
        with:
          cache: true
      - name: Formatters and linters
        run: mise run check
      - name: Shared shaders are in sync
        run: node scripts/sync-shaders.mjs --check
      - name: JS unit tests
        run: mise run test:js
      - name: Native plugin unit tests
        # Builds against the vendored plugin ABI header; no native library needed.
        run: mise run test:native
      - name: Build JS packages, gallery, and native plugins
        run: mise run build
      # The native viewer needs the patched maplibre-native-ffi build
      # (`mise run ffi:build`), which is far too slow for this workflow; it
      # runs on developer machines only.
